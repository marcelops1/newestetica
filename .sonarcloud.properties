# SonarQube Cloud — configuração do Automatic Analysis.
# Este repo NÃO usa sonar-project.properties: o Automatic Analysis o ignora; o arquivo
# suportado é este (verificado na documentação oficial; ver o design.md do change
# resolver-duplicacao-sonar-backend).
#
# Exclusões de CPD (duplicação) para os padrões de teste: scaffolds de integração e
# builders por spec são DAMP intencional (testes autocontidos por desenho — precedente dos
# módulos Agendamento/Catálogo/Conteúdo Público; docs/engineering/07 §14).
sonar.cpd.exclusions=backend/test/**,**/*.spec.ts
